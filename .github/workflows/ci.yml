name: CI

on:
  push:

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just bootstrap

      - name: Quality
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just quality

  test:
    name: Test (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    env:
      CLI_ENTRY: ${{ matrix.cli_entry }}
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just bootstrap

      - name: Build
        if: matrix.cli_entry == 'dist'
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just build-clean

      - name: Test
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          env: |
            CLI_ENTRY
          runCmd: ${{ matrix.cli_entry == 'dist' && 'just test' || 'just test-cov' }}

  example-test:
    name: Example Test (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just bootstrap

      - name: Type check example (before transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just type-check-example

      - name: Lint example (before transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just lint-example

      - name: Run example tests (before transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just test-example

      - name: Build
        if: matrix.cli_entry == 'dist'
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just build-clean

      - name: Transform example
        uses: devcontainers/ci@v0.3
        env:
          CLI_ENTRY: ${{ matrix.cli_entry }}
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          env: |
            CLI_ENTRY
          runCmd: just transform-example

      # The example tests pass against Joi and Zod alike, so without this a codemod that
      # silently did nothing would still leave the job green.
      - name: Verify the example was actually transformed
        run: |
          code=$(grep -vE '^\s*//' example/schemas.ts)
          if ! printf '%s' "$code" | grep -qE "from ['\"]zod['\"]"; then
            echo "::error::example/schemas.ts does not import zod after transformation"
            exit 1
          fi
          if printf '%s' "$code" | grep -qE "Joi\.|from ['\"]joi['\"]"; then
            echo "::error::example/schemas.ts still references joi after transformation"
            exit 1
          fi

      - name: Type check example (after transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just type-check-example

      - name: Lint example (after transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just lint-example

      - name: Run example tests (after transformation)
        uses: devcontainers/ci@v0.3
        with:
          imageName: joi-to-zod-codemod-devcontainer
          push: never
          runCmd: just test-example
